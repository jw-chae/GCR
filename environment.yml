name: gcr_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # If you have an NVIDIA GPU, these are the easiest reliable installs:
  - pytorch=2.5.1
  - torchvision=0.20.1
  - pytorch-cuda=12.1
  - pip
  - pip:
      - open_clip_torch==3.2.0
      - scikit-learn==1.8.0
      - tqdm==4.67.1
      - Pillow==9.4.0
      - matplotlib==3.10.8
      - omegaconf==2.3.0
      - faiss-cpu==1.8.0.post1
